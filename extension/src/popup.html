<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CallConsent</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1a1a2e;
      padding: 14px 16px 16px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    p.tagline {
      font-size: 11.5px;
      color: #555;
      margin: 0 0 14px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      padding: 6px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    #result {
      font-size: 12px;
      background: #f4f4f8;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: none;
    }
    #result.visible { display: block; }
    #result .classification {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }
    #result .notes {
      margin-top: 6px;
      color: #444;
      font-size: 11px;
    }
    .disclaimer {
      font-size: 10px;
      color: #888;
      line-height: 1.4;
      border-top: 1px solid #eee;
      padding-top: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>CallConsent</h1>
  <p class="tagline">Get alerted when an AI notetaker joins your Google Meet or Zoom call.</p>

  <label for="state-select">Your state</label>
  <select id="state-select">
    <option value="">Select your state…</option>
  </select>

  <div id="result"></div>

  <div class="disclaimer" id="disclaimer-text"></div>

  <script src="state-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
